aid: wingspan
name: Wingspan
description: Wingspan is a contractor payments and payroll platform built for the independent
  workforce, giving enterprises a single system to onboard 1099 contractors, collect W-9 and
  compliance documents, run approval-based payroll, pay collaborators by ACH or instant payout,
  and file 1099 tax forms. Its REST Payments API (OpenAPI 3.1) covers payables, invoicing,
  collaborators and groups, payable/invoice/1099 batches, deductions, eligibility requirements,
  custom fields, reporting, and webhooks, with embeddable onboarding and payout-settings UIs.
