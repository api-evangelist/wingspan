          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        tinType:
          type:
          - string
          - 'null'
          enum:
          - Individual
          - Business
          - null
    BulkCalculation1099Item:
      type: object
      properties:
        bulkCalculation1099BatchId:
          type: string
        bulkCalculation1099ItemId:
          type: string
        calculationType:
          type: string
          enum:
          - Balances
          - Submissions
        clientId:
          type: string
        createdAt:
          type: string
        eventActors:
          $ref: '#/components/schemas/87539cb97aa7616e350fc0d23c5a49177ea4c4a8bd00ec2a2cfd2a9a5c4e648a'
        labels:
          $ref: '#/components/schemas/LabelsDictionary'
        status:
