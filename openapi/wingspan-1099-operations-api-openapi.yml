          - Payer
          - Payee
          - System
        data:
          oneOf:
          - type: 'null'
          - type: object
        eventActor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RedactedMember'
        eventActorId:
          type:
          - string
          - 'null'
        previousData:
          oneOf:
          - type: 'null'
          - type: object
        recipientSyncToggled:
          type:
          - string
          - 'null'
